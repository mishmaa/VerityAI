services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verity}
      POSTGRES_USER: ${POSTGRES_USER:-verity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verity_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-deploying}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-verity}:${POSTGRES_PASSWORD:-verity_dev}@postgres:5432/${POSTGRES_DB:-verity}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
